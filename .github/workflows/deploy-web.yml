name: Deploy Barangay Malineng Website

# Auto-deploy to Firebase Hosting + Firestore/Storage rules
# every time something inside malineng-web/ changes on main.
on:
  push:
    branches: [main, master]
    paths:
      - "malineng-web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: malineng-web
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: malineng-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Kulang ang GitHub Secrets: FIREBASE_SERVICE_ACCOUNT at FIREBASE_PROJECT_ID"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Deploy Hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive

      # Storage is optional (may require Blaze plan on new projects). Failure here won't break the deploy.
      - name: Deploy Storage rules (optional)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@14 deploy --only storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
