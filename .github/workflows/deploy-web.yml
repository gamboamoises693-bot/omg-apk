name: Deploy Barangay Malineng Website

# Auto-deploy to Firebase Hosting (both sites listed in firebase.json:
# barangay-malineng.web.app and the default project URL) + Firestore rules every time
# something inside malineng-web/ changes on main.
#
# Auth uses Workload Identity Federation (keyless): GitHub proves its
# identity to Google, so no service account .json key is stored anywhere.
on:
  push:
    branches: [main, master]
    paths:
      - "malineng-web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for keyless auth to Google Cloud

env:
  # These are identifiers, not secrets. Safe to keep in the repo.
  FIREBASE_PROJECT_ID: project-a682ecac-e2d1-469c-bc7
  WIF_PROVIDER: projects/879724247614/locations/global/workloadIdentityPools/github/providers/github-repo
  WIF_SERVICE_ACCOUNT: firebase-adminsdk-fbsvc@project-a682ecac-e2d1-469c-bc7.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: malineng-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: malineng-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Hosting + Firestore rules
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
