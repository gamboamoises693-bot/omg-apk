name: Deploy Barangay Malineng Website

# Auto-deploy to Firebase Hosting + Firestore/Storage rules
# every time something inside malineng-web/ changes on main.
on:
  push:
    branches: [main, master]
    paths:
      - "malineng-web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: malineng-web
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      # Optional: custom Hosting site name (e.g. "barangay-malineng" -> barangay-malineng.web.app).
      # Leave unset to deploy to the project's default site.
      FIREBASE_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: malineng-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Kulang ang GitHub Secrets: FIREBASE_SERVICE_ACCOUNT at FIREBASE_PROJECT_ID"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Use custom Hosting site (optional)
        if: env.FIREBASE_HOSTING_SITE != ''
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
            cfg.hosting.site = process.env.FIREBASE_HOSTING_SITE.trim();
            fs.writeFileSync("firebase.json", JSON.stringify(cfg, null, 2));
            console.log("Deploying to site:", cfg.hosting.site);
          '

      - name: Deploy Hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
